function setTf(x){tf=x=='a'?'a':+x;render()}
function rAch(){const L=[...AC,...SX].filter(a=>af=='Все'||a.cat==af),got=Object.keys(S.ach).length,tot=AC.length+SX.length;$('#v').innerHTML=ptabs()+`<div class="card"><b>Достижения ${got}/${tot}</b><div class="bar"><i style="width:${got/tot*100}%"></i></div><div style="margin-top:8px">${['Все',...CATS].map(c=>`<button class="btn sm" style="margin:2px;${af==c?'':'opacity:.5'}" onclick="af='${c}';render()">${c}</button>`).join('')}</div></div><div class="card" style="padding:4px 12px">`+L.map(a=>{const ok=S.ach[a.id],h=a.hid&&!ok,v=Math.min(stat(a.key),a.n),c=TC[a.ti];return `<div class="ar"><div class="ai ${ok?'on':''}" style="border-color:${c};--c:${c}">${h?'❓':a.ic}</div><div style="flex:1;min-width:0"><b>${h?'Секретное достижение':a.nm}</b><div class="sm2">${h?'Условие скрыто':a.d}</div>${ok||h?'':`<div class="bar"><i style="width:${a.srv?0:v/a.n*100}%"></i></div>`}<div class="sm2">${ok?'✅ '+TI[a.ti]+' · получено':a.srv?'🔒 Требуется сервер':TI[a.ti]+' · '+K(Math.floor(v))+'/'+K(a.n)+' · 🪙 '+K(RWD[a.ti])}</div></div></div>`}).join('')+'</div>'}
function rTtl(){const L=TT.filter(t=>tf=='a'||t.r==tf);$('#v').innerHTML=ptabs()+`<div class="card"><div class="row sp"><b>Звания ${Object.keys(S.tt).length}/${TT.length}</b>${tbadge()}</div><div style="margin-top:8px">${['a',0,1,2,3,4,5].map(x=>`<button class="btn sm" style="margin:2px;${tf===(x=='a'?'a':x)?'':'opacity:.5'}" onclick="setTf('${x}')">${x=='a'?'Все':RT[x]}</button>`).join('')}</div></div>`+L.map(t=>{const ok=S.tt[t.id],h=t.r==5&&!ok,v=Math.min(stat(t.key),t.num);return `<div class="card" style="margin:8px 12px"><div class="row sp">${h?'<span class="tt t5">❓ ???</span>':chip(t)}${ok?(S.title==t.id?'<span class="sm2">✓ Активно</span>':`<button class="btn sm" onclick="S.title='${t.id}';render()">Выбрать</button>`):''}</div><div class="sm2" style="margin-top:6px">${h?'Секретное звание: условие скрыто':t.d}</div>${ok?'':`<div class="bar"><i style="width:${t.srv||h?0:v/t.num*100}%"></i></div><div class="sm2">${t.srv?'🔒 Требуется сервер':K(Math.floor(v))+'/'+K(t.num)}</div>`}</div>`}).join('')}
setInterval(()=>{if(!document.hidden){S.t+=5;chk();save()}},5000);
render();music();
</script></body></html>
